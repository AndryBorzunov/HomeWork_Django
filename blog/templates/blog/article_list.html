{% extends 'catalog/base.html' %}
{% load my_tags %}
{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Skystore</h1>
    <p class="lead">Блог</p>
        <p class="lead">
        <a class="btn btn-lg btn-block btn-outline-primary" href="{% url 'blog:article_create' %}">Создать блог</a>
    </p>
</div>
<div class="row text-center">
    {% for article in object_list %}
    <div class="col-6">
        <div class="card mb-4 box-shadow">
            <div class="card-header">
                <h4 class="my-0 font-weight-normal">{{ article.heading }}</h4>
            </div>
            <img src="{{ article.preview | media_filter }}">
            <div class="card-body">
                <p class="card text">
                    {{ article.content | truncatechars:100 }}
                </p>
                <div class="btn-group">
                    <a class="btn btn-lg btn-block btn-outline-primary" href="{% url 'blog:article_detail' article.pk %}">Посмотреть</a>
                    <a class="btn btn-lg btn-block btn-outline-primary" href="{% url 'blog:article_update' article.pk %}">Редактировать</a>
                    <a class="btn btn-lg btn-block btn-outline-primary" href="{% url 'blog:article_delete' article.pk %}">Удалить</a>
                </div>

            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
